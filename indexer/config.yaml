# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: loft-indexer
description: Loft payments on Monad (LoftEscrow events)
contracts:
  - name: LoftEscrow
    events:
      - event: "Sent(address indexed from, address indexed to, uint256 amount, bytes32 indexed ref)"
      - event: "LinkCreated(address indexed claimKey, address indexed sender, uint256 amount, uint256 expiry)"
      - event: "LinkClaimed(address indexed claimKey, address indexed sender, address indexed recipient, uint256 amount)"
      - event: "LinkRefunded(address indexed claimKey, address indexed sender, uint256 amount)"
      - event: "OrderCreated(uint256 indexed orderId, address indexed sender, address indexed recipient, uint256 amount, uint256 budget, uint256 firstDue, uint256 period, uint8 mode, uint256 minRate)"
      - event: "Remitted(uint256 indexed orderId, address indexed sender, address indexed recipient, uint256 amount, uint256 ngnPerUsd)"
      - event: "OrderSkipped(uint256 indexed orderId, uint256 ngnPerUsd)"
      - event: "OrderClosed(uint256 indexed orderId, address indexed sender, uint256 refunded)"
      - event: "PotCreated(uint256 indexed potId, address indexed organizer, address indexed beneficiary, uint256 target, uint256 deadline)"
      - event: "PotContributed(uint256 indexed potId, address indexed from, uint256 amount, bytes32 ref)"
      - event: "PotReleased(uint256 indexed potId, address indexed beneficiary, uint256 amount)"
  - name: LoftConvert
    events:
      - event: "Converted(address indexed owner, uint256 usdcIn, uint256 ausdOut, bytes32 salt)"
field_selection:
  transaction_fields:
    - hash
chains:
  # Monad mainnet. scripts/deploy.ts fills in the escrow address and start block.
  - id: 143
    start_block: 112495462
    contracts:
      - name: LoftEscrow
        address: "0xc2da029bd912516c2046fc928829f63749e6d275"
      # Any-chain top-ups: USDC delivered by Aurora Intents, turned into AUSD.
      - name: LoftConvert
        address: "0x0cba9430ae1fc9e4389f9e80a1470e0b178fda34"
